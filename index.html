<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Games</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(45deg, #1e1e1e, #3a3a3a);
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        header {
            background: #1e1e1e;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }
        .game-card {
            background: #222;
            border-radius: 10px;
            padding: 20px;
            margin: 15px;
            width: 250px;
            text-align: center;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }
        .game-card a {
            text-decoration: none;
            color: #ffcc00;
            font-weight: bold;
        }
        .game-card img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <header>Online Games</header>
    <div class="container">
        <div class="game-card">
            <img src="/Bplogo.webp" alt="Krunker.io">
            <h3>Krunker.io</h3>
            <a href="https://krunker.io/" target="_blank">Play Now</a>
        </div>
        <div class="game-card">
            <img src="/Agar.io_appstore_logo.png" alt="Agar.io">
            <h3>Agar.io</h3>

        </div>
        <div class="game-card">

            <h3>Shell Shockers</h3>
            <a href="https://shellshock.io/" target="_blank">Play Now</a>
        </div>
        <div class="game-card">

            <h3>Paper.io 2</h3>
            <a href="https://paper-io.com/" target="_blank">Play Now</a>

        <div class="game-card">
